<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>小孙同学</title>
    <meta name="language" content="zh-CN" />
    <meta name="title" content="小孙同学" />
    <meta
      name="github"
      content="https://github.com/sun0225SUN/Awesome-Love-Code"
    />
    <meta
      name="describe"
      content="收集不易，您的star是我坚持的动力，同时也欢迎各位PR哦! "
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://cdn.jsdelivr.net/gh/sun0225SUN/photos/img/20210715233345.png"
    />
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: rgb(255, 192, 203);
      }

      .container {
        color: white;
        text-align: center;
        width: 600px;
        height: 600px;
        position: relative; /* 为绝对定位的文字提供参考 */
        overflow: hidden;
      }

      /* 确保 canvas 在底层 */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        z-index: 1;
        position: relative;
        background: transparent;
      }

      /* 新增：覆盖在 canvas 上的文字样式 */
      .caption {
        position: absolute;
        left: 50%;
        top: 82%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-size: 26px;
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: 2px;
        text-align: center;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255,255,255,0.05);
        pointer-events: none; /* 不阻塞画布交互 */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        white-space: nowrap;
        z-index: 2;
        padding: 6px 12px;
        background: rgba(0,0,0,0.18);
        border-radius: 6px;
      }

      /* 小屏幕适配 */
      @media (max-width: 420px) {
        .caption {
          font-size: 18px;
          top: 78%;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <canvas id="c"></canvas>

      <!-- 新增：页面文本 -->
      <div class="caption">落俗不可避免 浪漫至死不渝</div>

      <script>
        // 简化并修复的绘图脚本：渲染浮动彩色粒子，替代被截断的原始脚本
        (function () {
          var canvas = document.getElementById('c');
          var ctx = canvas.getContext('2d');
          var DPR = window.devicePixelRatio || 1;

          function resize() {
            var rect = canvas.getBoundingClientRect();
            canvas.width = Math.max(300, Math.floor(rect.width * DPR));
            canvas.height = Math.max(300, Math.floor(rect.height * DPR));
            ctx.scale(DPR, DPR);
          }

          window.addEventListener('resize', function () {
            // clear transform and re-resize
            ctx.setTransform(1,0,0,1,0,0);
            resize();
          });

          resize();

          // 粒子数据
          var particles = [];
          var N = 120;

          function rand(min, max) { return Math.random() * (max - min) + min; }

          for (var i = 0; i < N; i++) {
            particles.push({
              x: rand(0, 600),
              y: rand(0, 600),
              r: rand(2, 18),
              vx: rand(-0.3, 0.3),
              vy: rand(-0.2, 0.2),
              hue: Math.floor(rand(0, 360)),
              alpha: rand(0.3, 0.9)
            });
          }

          function draw() {
            // clear with soft pink background
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // draw blurred translucent background
            ctx.fillStyle = 'rgba(255,192,203,0.08)';
            ctx.fillRect(0,0,canvas.width/DPR,canvas.height/DPR);

            for (var i = 0; i < particles.length; i++) {
              var p = particles[i];
              p.x += p.vx;
              p.y += p.vy + 0.05 * Math.sin((Date.now() + i * 1000) / 1500);

              // wrap
              if (p.x < -50) p.x = canvas.width/DPR + 50;
              if (p.x > canvas.width/DPR + 50) p.x = -50;
              if (p.y < -50) p.y = canvas.height/DPR + 50;
              if (p.y > canvas.height/DPR + 50) p.y = -50;

              var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*2);
              g.addColorStop(0, 'hsla('+p.hue+',90%,'+ (50 + p.r) +'%, '+p.alpha+')');
              g.addColorStop(1, 'hsla('+((p.hue+60)%360)+',80%,60%,0);');

              ctx.beginPath();
              ctx.fillStyle = g;
              ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
              ctx.fill();
            }

            requestAnimationFrame(draw);
          }

          draw();
        })();
      </script>
    </div>
  </body>
</html>
